<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ben</title>
    <link rel="icon" type="image/png" href="/ikona.png" />
    
    <!-- Import nowoczesnej czcionki -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout" id="appLayout">
        
        <!-- SLOT 0: GŁÓWNY (DUŻY) -->
        <div class="panel-slot slot-large" data-slot-id="0" id="slot-0">
            <!-- 1. SLIDER ZE ZDJĘCIAMI -->
            <div class="app-panel panel-slider slider-container" id="panel-slider" data-panel-id="panel-slider">
                <div class="drag-handle" title="Przeciągnij panel">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <circle cx="8" cy="6" r="2"/>
                        <circle cx="16" cy="6" r="2"/>
                        <circle cx="8" cy="12" r="2"/>
                        <circle cx="16" cy="12" r="2"/>
                        <circle cx="8" cy="18" r="2"/>
                        <circle cx="16" cy="18" r="2"/>
                    </svg>
                </div>

                <div class="slides-wrapper">
                    <div class="slides-track" id="slidesTrack">
                        <!-- Zmień atrybuty src na swoje zdjęcia -->
                        <div class="slide"><img src="zdjecia/1.jpg" alt="Zdjęcie 1" loading="lazy"></div>
                        <div class="slide"><img src="zdjecia/2.jpg" alt="Zdjęcie 2" loading="lazy"></div>
                        <div class="slide"><img src="zdjecia/3.jpg" alt="Zdjęcie 3" loading="lazy"></div>
                        <div class="slide"><img src="zdjecia/4.jpg" alt="Zdjęcie 4" loading="lazy"></div>
                        <div class="slide"><img src="zdjecia/5.jpg" alt="Zdjęcie 5" loading="lazy"></div>
                        <div class="slide"><img src="zdjecia/6.jpg" alt="Zdjęcie 6" loading="lazy"></div>
                        <div class="slide"><img src="zdjecia/7.jpg" alt="Zdjęcie 7" loading="lazy"></div>
                        <div class="slide"><img src="zdjecia/8.jpg" alt="Zdjęcie 8" loading="lazy"></div>
                        <div class="slide"><img src="zdjecia/9.jpg" alt="Zdjęcie 9" loading="lazy"></div>
                        <div class="slide"><img src="zdjecia/10.jpg" alt="Zdjęcie 10" loading="lazy"></div>
                        <div class="slide"><img src="zdjecia/11.jpg" alt="Zdjęcie 11" loading="lazy"></div>
                        <div class="slide"><img src="zdjecia/12.jpg" alt="Zdjęcie 12" loading="lazy"></div>
                    </div>

                    <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
                    <button class="next" onclick="changeSlide(1)">&#10095;</button>

                    <div class="top-controls">
                        <button id="playPauseBtn" onclick="togglePlayPause()" title="Zatrzymaj/Wznów">&#10074;&#10074;</button>
                        <button id="fullscreenBtn" onclick="toggleFullscreen()" title="Pełny ekran">&#9974;</button>
                    </div>

                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>
                
                <div class="thumbnails-container" id="thumbnailsContainer"></div>
            </div>
        </div>

        <!-- BOCZNY PANEL: 3 SLOTY -->
        <div class="sidebar-slots" id="sidebarSlots">
            
            <!-- SLOT 1 -->
            <div class="panel-slot slot-small" data-slot-id="1" id="slot-1">
                <!-- LICZNIK WIEKU -->
                <div class="app-panel widget-box age-widget" id="panel-age" data-panel-id="panel-age">
                    <div class="drag-handle" title="Przeciągnij panel">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <circle cx="8" cy="6" r="2"/>
                            <circle cx="16" cy="6" r="2"/>
                            <circle cx="8" cy="12" r="2"/>
                            <circle cx="16" cy="12" r="2"/>
                            <circle cx="8" cy="18" r="2"/>
                            <circle cx="16" cy="18" r="2"/>
                        </svg>
                    </div>
                    <div class="widget-header">
                        <h2>🐶 Ben jest z nami <span>dokładnie</span></h2>
                        <p class="widget-subtitle">Każda sekunda z nim to czysta radość! 🐾</p>
                    </div>
                    <div class="age-grid">
                        <div class="time-box"><span id="c-years">0</span><span class="label">Lata</span></div>
                        <div class="time-box"><span id="c-months">0</span><span class="label">Mies.</span></div>
                        <div class="time-box"><span id="c-days">0</span><span class="label">Dni</span></div>
                        <div class="time-box"><span id="c-hours">0</span><span class="label">Godz.</span></div>
                        <div class="time-box"><span id="c-minutes">0</span><span class="label">Minut</span></div>
                        <div class="time-box"><span id="c-seconds">0</span><span class="label">Sekund</span></div>
                    </div>
                    <div class="age-footer">
                        <span class="badge">Urodziny Bena: 15 sierpnia 2022 🎂</span>
                    </div>
                </div>
            </div>

            <!-- SLOT 2 -->
            <div class="panel-slot slot-small" data-slot-id="2" id="slot-2">
                <!-- CYTAT DNIA -->
                <div class="app-panel widget-box quote-widget" id="panel-quote" data-panel-id="panel-quote">
                    <div class="drag-handle" title="Przeciągnij panel">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <circle cx="8" cy="6" r="2"/>
                            <circle cx="16" cy="6" r="2"/>
                            <circle cx="8" cy="12" r="2"/>
                            <circle cx="16" cy="12" r="2"/>
                            <circle cx="8" cy="18" r="2"/>
                            <circle cx="16" cy="18" r="2"/>
                        </svg>
                    </div>
                    <div class="quote-header">
                        <h3>💬 Myśl dnia</h3>
                        <button class="quote-refresh-btn" onclick="getRandomQuote(event)" title="Wylosuj inną myśl">&#8635; Losuj</button>
                    </div>
                    <div class="quote-body">
                        <span class="quote-mark quote-open">&ldquo;</span>
                        <p id="benQuote">"Pobieranie myśli..."</p>
                        <span class="quote-mark quote-close">&rdquo;</span>
                    </div>
                    <div class="quote-author">&mdash; Ben, filozof na czterech łapach 🐾</div>
                </div>
            </div>

            <!-- SLOT 3 -->
            <div class="panel-slot slot-small" data-slot-id="3" id="slot-3">
                <!-- DAJ PRZYSMAK -->
                <div class="app-panel widget-box treat-widget" id="panel-treat" data-panel-id="panel-treat">
                    <div class="drag-handle" title="Przeciągnij panel">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <circle cx="8" cy="6" r="2"/>
                            <circle cx="16" cy="6" r="2"/>
                            <circle cx="8" cy="12" r="2"/>
                            <circle cx="16" cy="12" r="2"/>
                            <circle cx="8" cy="18" r="2"/>
                            <circle cx="16" cy="18" r="2"/>
                        </svg>
                    </div>
                    <div class="treat-inner" id="treatSection">
                        <button class="treat-btn" onclick="giveTreat(event)">🦴 Daj przysmak!</button>
                        <div class="treat-counter">
                            Rozdano już <br><span id="treatCount">0</span> smakołyków 🥩
                        </div>
                        <div class="treat-bonus-bar">
                            <span class="treat-tag" onclick="giveSpecialTreat(event, '🦴')">🦴 Kość</span>
                            <span class="treat-tag" onclick="giveSpecialTreat(event, '🥩')">🥩 Stek</span>
                            <span class="treat-tag" onclick="giveSpecialTreat(event, '🥓')">🥓 Boczek</span>
                            <span class="treat-tag" onclick="giveSpecialTreat(event, '🍗')">🍗 Udko</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- PRZYCISK RESETU UKŁADU -->
    <button class="reset-layout-btn" id="resetLayoutBtn" onclick="resetLayout()" title="Przywróć domyślny układ paneli">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        <span>Resetuj układ</span>
    </button>

    <!-- KONTENER NA ELEMENTY-WIDMA (GHOST) PODCZAS PRZECIĄGANIA -->
    <div id="dragGhostContainer"></div>

    <script src="script.js"></script>
</body>
</html>
