<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben</title>
    <link rel="icon" type="image/png" href="/ikona.png" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        /* GŁÓWNY KONTENER */
        .slider-container {
            position: relative;
            max-width: 1200px;
            width: 95%;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* STREFA ZDJĘĆ */
        .slides-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            overflow: hidden; /* Ukrywa to, co wystaje poza kontener */
        }
        
        /* NOWY KONTENER PRZESUWAJĄCY ZDJĘCIA (TRACK) */
        .slides-track {
            display: flex;
            width: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); /* Płynne, kinowe przejście */
        }
        
        .slide {
            flex: 0 0 100%; /* Każde zdjęcie zajmuje dokładnie 100% szerokości slidera */
            width: 100%;
        }
        
        .slide img {
            width: 100%;
            height: 650px;
            object-fit: contain;
            display: block;
        }

        /* STRZAŁKI NAWIGACJI */
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding: 20px;
            color: white;
            font-weight: bold;
            font-size: 28px;
            transition: 0.3s ease;
            user-select: none;
            background-color: rgba(0, 0, 0, 0.4);
            border: none;
            border-radius: 0 5px 5px 0;
            z-index: 10;
        }
        .next {
            right: 0;
            border-radius: 5px 0 0 5px;
        }
        .prev:hover, .next:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* PASEK POSTĘPU */
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.2);
            z-index: 10;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: white;
        }

        /* GÓRNE PRZYCISKI (PLAY/PAUZA, FULLSCREEN) */
        .top-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .top-controls button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            cursor: pointer;
            width: 45px;
            height: 45px;
            font-size: 20px;
            border-radius: 8px;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .top-controls button:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }

        /* MINIATURKI (ZAMIAST KROPEK) */
        .thumbnails-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 15px 10px;
            background-color: #111;
            overflow-x: auto;
        }
        .thumbnail {
            cursor: pointer;
            height: 50px;
            width: 80px;
            object-fit: cover;
            opacity: 0.4;
            transition: 0.3s ease;
            border-radius: 4px;
            border: 2px solid transparent;
        }
        .active-thumb, .thumbnail:hover {
            opacity: 1;
            border-color: white;
        }

        /* TRYB PEŁNOEKRANOWY (FULLSCREEN) */
        .slider-container:fullscreen {
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
        }
        .slider-container:fullscreen .slide img {
            height: calc(100vh - 84px);
        }
    </style>
</head>
<body>

    <div class="slider-container" id="sliderContainer">
        
        <div class="slides-wrapper">
            <!-- Pasek (track), który będzie się przesuwał w lewo i prawo -->
            <div class="slides-track" id="slidesTrack">
                <div class="slide"><img src="zdjecia/1.jpg" alt="Zdjęcie 1" loading="lazy"></div>
                <div class="slide"><img src="zdjecia/2.jpg" alt="Zdjęcie 2" loading="lazy"></div>
                <div class="slide"><img src="zdjecia/3.jpg" alt="Zdjęcie 3" loading="lazy"></div>
                <div class="slide"><img src="zdjecia/4.jpg" alt="Zdjęcie 4" loading="lazy"></div>
                <div class="slide"><img src="zdjecia/5.jpg" alt="Zdjęcie 5" loading="lazy"></div>
                <div class="slide"><img src="zdjecia/6.jpg" alt="Zdjęcie 6" loading="lazy"></div>
                <div class="slide"><img src="zdjecia/7.jpg" alt="Zdjęcie 7" loading="lazy"></div>
                <div class="slide"><img src="zdjecia/8.jpg" alt="Zdjęcie 8" loading="lazy"></div>
                <div class="slide"><img src="zdjecia/9.jpg" alt="Zdjęcie 9" loading="lazy"></div>
                <div class="slide"><img src="zdjecia/10.jpg" alt="Zdjęcie 10" loading="lazy"></div>
                <div class="slide"><img src="zdjecia/11.jpg" alt="Zdjęcie 11" loading="lazy"></div>
                <div class="slide"><img src="zdjecia/12.jpg" alt="Zdjęcie 12" loading="lazy"></div>
            </div>

            <!-- Przyciski strzałek -->
            <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
            <button class="next" onclick="changeSlide(1)">&#10095;</button>

            <!-- Przyciski akcji na górze -->
            <div class="top-controls">
                <button id="playPauseBtn" onclick="togglePlayPause()" title="Zatrzymaj/Wznów">&#10074;&#10074;</button>
                <button id="fullscreenBtn" onclick="toggleFullscreen()" title="Pełny ekran">&#9974;</button>
            </div>

            <!-- Pasek postępu -->
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <!-- Pasek z miniaturkami wygeneruje się tu przez JavaScript -->
        <div class="thumbnails-container" id="thumbnailsContainer"></div>
    </div>

    <script>
        let slideIndex = 1;
        let isPlaying = true;
        let autoSlideTimer;
        let progressTimer;
        let progressWidth = 0;
        const slideDuration = 5000;

        let touchStartX = 0;
        let touchEndX = 0;

        generateThumbnails();
        showSlides(slideIndex);
        startAutoSlide();

        function generateThumbnails() {
            const slides = document.querySelectorAll(".slide img");
            const thumbsContainer = document.getElementById("thumbnailsContainer");
            thumbsContainer.innerHTML = "";
            
            slides.forEach((img, index) => {
                const thumb = document.createElement("img");
                thumb.src = img.src;
                thumb.className = "thumbnail";
                thumb.onclick = () => currentSlide(index + 1);
                thumbsContainer.appendChild(thumb);
            });
        }

        function showSlides(n) {
            let slides = document.getElementsByClassName("slide");
            let thumbs = document.getElementsByClassName("thumbnail");
            const track = document.getElementById("slidesTrack");
            
            if (n > slides.length) { slideIndex = 1; }
            if (n < 1) { slideIndex = slides.length; }
            
            // Logika przesuwania - przesuwamy kontener o odpowiednią wielkość (%)
            let movePercentage = (slideIndex - 1) * -100;
            track.style.transform = `translateX(${movePercentage}%)`;
            
            // Podświetlanie aktualnej miniaturki
            for (let i = 0; i < thumbs.length; i++) {
                thumbs[i].className = thumbs[i].className.replace(" active-thumb", "");
            }
            
            if (thumbs.length > 0) {
                thumbs[slideIndex - 1].className += " active-thumb";
                thumbs[slideIndex - 1].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
            
            resetProgressBar();
        }

        function changeSlide(n) {
            showSlides(slideIndex += n);
            if(isPlaying) resetAutoSlide();
        }

        function currentSlide(n) {
            showSlides(slideIndex = n);
            if(isPlaying) resetAutoSlide();
        }

        function startAutoSlide() {
            if (!isPlaying) return;
            autoSlideTimer = setInterval(() => {
                slideIndex++;
                showSlides(slideIndex);
            }, slideDuration);
            startProgressBar();
        }

        function resetAutoSlide() {
            clearInterval(autoSlideTimer);
            if(isPlaying) startAutoSlide();
        }

        function startProgressBar() {
            clearInterval(progressTimer);
            progressWidth = 0;
            const progressBar = document.getElementById("progressBar");
            
            progressTimer = setInterval(() => {
                progressWidth += (50 / slideDuration) * 100;
                progressBar.style.width = progressWidth + "%";
                if(progressWidth >= 100) progressWidth = 0;
            }, 50);
        }

        function resetProgressBar() {
            clearInterval(progressTimer);
            const progressBar = document.getElementById("progressBar");
            progressBar.style.width = "0%";
            if(isPlaying) startProgressBar();
        }

        function togglePlayPause() {
            const btn = document.getElementById("playPauseBtn");
            if (isPlaying) {
                isPlaying = false;
                clearInterval(autoSlideTimer);
                clearInterval(progressTimer);
                btn.innerHTML = "&#9658;";
            } else {
                isPlaying = true;
                btn.innerHTML = "&#10074;&#10074;";
                resetAutoSlide();
            }
        }

        function toggleFullscreen() {
            const slider = document.getElementById("sliderContainer");
            if (!document.fullscreenElement) {
                if (slider.requestFullscreen) {
                    slider.requestFullscreen();
                } else if (slider.webkitRequestFullscreen) {
                    slider.webkitRequestFullscreen();
                } else if (slider.msRequestFullscreen) {
                    slider.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // OBSŁUGA GESTÓW
        const sliderWrapper = document.querySelector('.slides-wrapper');
        
        sliderWrapper.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        sliderWrapper.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const threshold = 50;
            if (touchStartX - touchEndX > threshold) {
                changeSlide(1);
            }
            if (touchEndX - touchStartX > threshold) {
                changeSlide(-1);
            }
        }
    </script>
</body>
</html>
